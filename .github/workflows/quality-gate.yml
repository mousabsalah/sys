name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (with pcov coverage driver)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, tokenizer, xml, ctype, json, pcov

      - name: Cache Composer (XDG path)
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Bootstrap environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Pint (style)
        working-directory: backend
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis)
        working-directory: backend
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: PHPUnit + coverage floor (60% Lines)
        working-directory: backend
        run: |
          vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text | tee coverage.txt
          python3 -c "import re,sys; t=open('coverage.txt').read(); print(t); m=re.search(r'Lines:\s*([0-9.]+)%', t); assert m, 'no Lines coverage metric in summary — refusing to pass silently'; v=float(m.group(1)); print(f'Lines coverage: {v}% (floor 60)'); sys.exit(0 if v >= 60 else 1)"

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Go build & vet
        working-directory: engine
        run: |
          go build ./...
          go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: oxlint
        working-directory: frontend
        run: npx oxlint

      - name: Vitest
        working-directory: frontend
        run: npm test
